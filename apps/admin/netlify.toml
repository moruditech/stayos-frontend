# Build command/base/package/publish directory are already configured via
# the Netlify UI for this site — left alone here on purpose. The one thing
# with no UI equivalent is "ignore", so thats the only key this file sets.
[build]
  # turbo query affected replaces the now-deprecated turbo-ignore. It walks
  # the real dependency graph (not a hardcoded folder list), so a change to
  # e.g. packages/constants only triggers this site if @stayos/app-admin actually depends
  # on it. Exit 1 = affected -> Netlify builds. Exit 0 = not affected ->
  # Netlify skips. Exit 2 = error -> Netlify builds anyway (fails safe).
  ignore = "npx turbo query affected --base=$CACHED_COMMIT_REF --head=$COMMIT_REF --packages @stayos/app-admin --exit-code"
